<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}.gsbar{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:space-between;background:#E4002B;color:#fff;font:600 13px Barlow,system-ui,sans-serif;padding:6px max(16px,env(safe-area-inset-left,0px))}.gsbar .gsacts{display:flex;gap:6px;flex-wrap:wrap}.gsbar button,.gsbar .gsimp{border:1px solid rgba(255,255,255,.8);background:transparent;color:#fff;border-radius:99px;padding:3px 10px;font:700 12px Barlow,system-ui,sans-serif;cursor:pointer}.gsbar button:hover,.gsbar .gsimp:hover{background:rgba(255,255,255,.15)}</style>
<script>
/* GSCG Hub, GitHub Pages edition.
   The page keeps the claude.use() calls it had as a Claude page. Here they are answered from:
   - data.json in this repo (the shared starting point everyone sees), plus
   - each person's own changes, saved in their browser (localStorage for posts and records,
     IndexedDB for photos and videos they upload).
   Export/Import moves one person's changes to someone else as a file. */
(function(){
  var KEY="gscg-hub-local-v1",FILEDB="gscg-hub-files",STORE="files";
  var seed={},local={sets:{},dels:{}},subs={},ready=null;
  try{var raw=localStorage.getItem(KEY);if(raw){var p=JSON.parse(raw);local.sets=p.sets||{};local.dels=p.dels||{}}}catch(e){}
  function persist(){try{localStorage.setItem(KEY,JSON.stringify(local))}catch(e){alertBar("This browser is out of space for saved changes. Use Export to keep them.")}}
  function load(){if(!ready)ready=fetch("data.json?v="+Date.now(),{cache:"no-store"}).then(function(r){return r.ok?r.json():{data:{}}}).catch(function(){return{data:{}}}).then(function(j){seed=j.data||{};return seed});return ready}
  function docsOf(col){
    var m={};(seed[col]||[]).forEach(function(d){m[d.id]=d.data});
    var s=local.sets[col]||{},dl=local.dels[col]||{};
    Object.keys(s).forEach(function(id){m[id]=s[id]});
    Object.keys(dl).forEach(function(id){delete m[id]});
    return Object.keys(m).map(function(id){return{id:id,data:m[id]}});
  }
  function emit(col){var docs=docsOf(col).map(function(d){return{id:d.id,data:function(){return d.data}}});(subs[col]||[]).forEach(function(cb){try{cb({docs:docs})}catch(e){}})}
  function emitAll(){Object.keys(subs).forEach(emit)}
  var db={collection:function(col){return{
    onSnapshot:function(cb){(subs[col]=subs[col]||[]).push(cb);load().then(function(){emit(col)});return function(){}},
    doc:function(id){return{
      set:function(o){(local.sets[col]=local.sets[col]||{})[id]=JSON.parse(JSON.stringify(o));if(local.dels[col])delete local.dels[col][id];persist();emit(col);markDirty();return Promise.resolve()},
      delete:function(){if(local.sets[col])delete local.sets[col][id];(local.dels[col]=local.dels[col]||{})[id]=1;persist();emit(col);markDirty();return Promise.resolve()}
    }}
  }}};
  /* files people upload: kept in IndexedDB, served at blob/local-* by sw.js */
  function idb(){return new Promise(function(res,rej){var r=indexedDB.open(FILEDB,1);r.onupgradeneeded=function(){r.result.createObjectStore(STORE)};r.onsuccess=function(){res(r.result)};r.onerror=function(){rej(r.error)}})}
  function idbPut(k,v){return idb().then(function(d){return new Promise(function(res,rej){var tx=d.transaction(STORE,"readwrite");tx.objectStore(STORE).put(v,k);tx.oncomplete=res;tx.onerror=function(){rej(tx.error)}})})}
  function idbDel(k){return idb().then(function(d){return new Promise(function(res){var tx=d.transaction(STORE,"readwrite");tx.objectStore(STORE).delete(k);tx.oncomplete=res;tx.onerror=res})})}
  function idbAll(){return idb().then(function(d){return new Promise(function(res){var out={},tx=d.transaction(STORE,"readonly"),st=tx.objectStore(STORE),c=st.openCursor();c.onsuccess=function(){var cur=c.result;if(cur){out[cur.key]=cur.value;cur.continue()}else res(out)};c.onerror=function(){res(out)}})})}
  var EXT={"image/jpeg":".jpg","image/png":".png","image/gif":".gif","image/webp":".webp","video/mp4":".mp4","video/quicktime":".mov","video/webm":".webm","image/svg+xml":".svg"};
  var assets={
    upload:function(blob,opt){var type=(opt&&opt.type)||blob.type||"application/octet-stream";if(blob.size>60*1024*1024)return Promise.reject({code:"too_large"});var id="local-"+Date.now().toString(36)+Math.random().toString(36).slice(2,8)+(EXT[type]||"");var b=blob.type===type?blob:new Blob([blob],{type:type});return idbPut(id,b).then(function(){markDirty();return{id:id,url:"blob/"+id,contentType:type,sizeBytes:b.size}})},
    delete:function(id){return /^local-/.test(id)?idbDel(id):Promise.resolve()},
    list:function(){return Promise.resolve({assets:[],usage:{}})}
  };
  var user={me:function(){return Promise.resolve({})},id:function(){return Promise.resolve("")},can:function(){return Promise.resolve(true)},isOwner:function(){return false},canEdit:function(){return true}};
  function saveFile(name,blob){var url=URL.createObjectURL(blob);var a=document.createElement("a");a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(url)},5000)}
  var downloads={save:function(o){saveFile(o.filename||"download",o.data instanceof Blob?o.data:new Blob([o.data]));return Promise.resolve()}};
  var map={db:db,assets:assets,user:user,downloads:downloads};
  window.claude={use:function(n){return Promise.resolve(map[n]||null)}};

  /* service worker that serves locally uploaded files */
  if("serviceWorker" in navigator){navigator.serviceWorker.register("sw.js").catch(function(){})}

  /* export / import / reset */
  function blobToData(b){return new Promise(function(res){var r=new FileReader();r.onload=function(){res(r.result)};r.readAsDataURL(b)})}
  function dataToBlob(u){return fetch(u).then(function(r){return r.blob()})}
  function count(){var n=0;Object.keys(local.sets).forEach(function(c){n+=Object.keys(local.sets[c]).length});Object.keys(local.dels).forEach(function(c){n+=Object.keys(local.dels[c]).length});return n}
  function markDirty(){var b=document.getElementById("gsExp");if(b)b.textContent="Export my changes ("+count()+")"}
  window.GSCG={
    exportChanges:function(){
      var who=(document.querySelector("#roleSel")||{}).value||"";
      idbAll().then(function(files){var keys=Object.keys(files),out={};return Promise.all(keys.map(function(k){return blobToData(files[k]).then(function(d){out[k]=d})})).then(function(){return out})}).then(function(files){
        var payload={app:"gscg-hub",exported:new Date().toISOString(),from:String(who).replace(/^p:/,""),sets:local.sets,dels:local.dels,files:files};
        var stamp=new Date().toISOString().slice(0,16).replace(/[:T]/g,"-");
        saveFile("gscg-hub-changes-"+stamp+".json",new Blob([JSON.stringify(payload)],{type:"application/json"}));
      });
    },
    importChanges:function(file){
      return file.text().then(function(txt){var p=JSON.parse(txt);if(p.app!=="gscg-hub")throw new Error("Not a GSCG Hub file");
        Object.keys(p.sets||{}).forEach(function(c){local.sets[c]=local.sets[c]||{};Object.keys(p.sets[c]).forEach(function(id){local.sets[c][id]=p.sets[c][id];if(local.dels[c])delete local.dels[c][id]})});
        Object.keys(p.dels||{}).forEach(function(c){local.dels[c]=local.dels[c]||{};Object.keys(p.dels[c]).forEach(function(id){local.dels[c][id]=1;if(local.sets[c])delete local.sets[c][id]})});
        persist();
        var fs=p.files||{};return Promise.all(Object.keys(fs).map(function(k){return dataToBlob(fs[k]).then(function(b){return idbPut(k,b)})})).then(function(){emitAll();markDirty();return p.from||"someone"});
      });
    },
    reset:function(){local={sets:{},dels:{}};persist();emitAll();markDirty()}
  };
  function alertBar(t){var b=document.getElementById("gsNote");if(b)b.textContent=t}
  document.addEventListener("DOMContentLoaded",function(){
    var bar=document.createElement("div");bar.className="gsbar";
    bar.innerHTML='<span id="gsNote"><b>Team preview.</b> Your changes save in this browser only. Send them to Dylan with Export.</span><span class="gsacts"><button type="button" id="gsExp">Export my changes</button><label class="gsimp">Import changes<input type="file" id="gsImp" accept="application/json,.json" hidden></label><button type="button" id="gsReset">Reset to shared version</button></span>';
    document.body.insertBefore(bar,document.body.firstChild);markDirty();
    document.getElementById("gsExp").onclick=function(){window.GSCG.exportChanges()};
    document.getElementById("gsImp").onchange=function(e){var f=e.target.files[0];e.target.value="";if(!f)return;window.GSCG.importChanges(f).then(function(from){alertBar("Imported changes from "+from+".")}).catch(function(err){alertBar("Could not import that file: "+(err&&err.message||err))})};
    var armed=false;document.getElementById("gsReset").onclick=function(){if(!armed){armed=true;this.textContent="Click again to erase your changes";var s=this;setTimeout(function(){armed=false;s.textContent="Reset to shared version"},4000);return}armed=false;window.GSCG.reset();this.textContent="Reset to shared version";alertBar("Back to the shared version.")};
  });
})();

</script>
<title>GSCG Hub</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: navy brand band with role switch, scrolling tab bar, one working area per tab (calendar, pipeline, approvals, week, photos, brand kit, results). */
:root{
  --navy:#14213D; --red:#E4002B; --cream:#F5F3EE; --white:#FFFFFF; --blue30:#B4BECA;
  --bg:#F5F3EE; --surface:#FFFFFF; --surface2:#EEF0F4; --ink:#14213D; --muted:#4A5568; --line:#D5D9E2;
  --accent:#E4002B; --accent-ink:#B8001F; --on-accent:#FFFFFF; --tint:#FDE6EA;
  --c-pre:#E4002B; --c-case:#14213D; --c-trips:#2F66A8; --c-events:#A86400; --c-general:#6B7A93;
  --ok:#1F7A4D; --warn:#A86400; --okbg:#E4F3EA; --fade:#6B7586;
  --head:'Barlow Condensed','Arial Narrow',Impact,sans-serif; --body:Barlow,system-ui,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D1730; --surface:#14213D; --surface2:#1B2B4F; --ink:#F5F3EE; --muted:#B4BECA; --line:#2B3C63;
  --accent:#E4002B; --accent-ink:#FF6B83; --tint:#3A1B2B;
  --c-pre:#FF4D69; --c-case:#9FB1D6; --c-trips:#6FA3E6; --c-events:#E8A93F; --c-general:#8C9BB5;
  --ok:#58C58A; --warn:#E8A93F; --okbg:#173A33; --fade:#8C97A9; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1730; --surface:#14213D; --surface2:#1B2B4F; --ink:#F5F3EE; --muted:#B4BECA; --line:#2B3C63;
  --accent:#E4002B; --accent-ink:#FF6B83; --tint:#3A1B2B;
  --c-pre:#FF4D69; --c-case:#9FB1D6; --c-trips:#6FA3E6; --c-events:#E8A93F; --c-general:#8C9BB5;
  --ok:#58C58A; --warn:#E8A93F; --okbg:#173A33; --fade:#8C97A9; color-scheme:dark}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 var(--body)}
h1,h2,h3{font-family:var(--head);font-weight:700;text-transform:uppercase;letter-spacing:.02em;margin:0;text-wrap:balance;line-height:1.05}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent-ink);outline-offset:2px;border-radius:4px}
.wrap{max-width:1240px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.band{background:var(--navy);color:#fff;border-bottom:6px solid var(--red)}
.band .wrap{display:flex;align-items:center;gap:18px;padding-block:18px;flex-wrap:wrap}
.band img.lg0{width:54px;height:54px;flex:none}
.band .kick{font:700 14px/1 var(--head);letter-spacing:.2em;color:#E4002B;text-transform:uppercase}
.band h1{font-size:clamp(34px,6vw,54px);margin-top:4px;color:#fff}
.band .sp{flex:1}
.role{display:flex;flex-wrap:nowrap;flex:0 0 auto;align-items:center;gap:8px;color:var(--blue30);font-size:13px;font-weight:600;white-space:nowrap}
.role select{width:auto;max-width:170px;text-overflow:ellipsis}
.role select{background:#1E2D4F;color:#fff;border:1px solid rgba(255,255,255,.35);border-radius:8px;padding:6px 10px;font-size:14px}
.theme{border:1px solid rgba(255,255,255,.35);background:transparent;color:#fff;border-radius:8px;padding:6px 12px;font:600 13px var(--body)}
.theme:hover{background:rgba(255,255,255,.12)}
.tabs{background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.tabs .wrap{display:flex;gap:2px;overflow-x:auto;scrollbar-width:thin}
.tab{flex:none;border:0;background:transparent;padding:14px 13px 11px;font:700 19px/1 var(--head);letter-spacing:.05em;text-transform:uppercase;color:var(--muted);border-bottom:4px solid transparent;display:flex;align-items:center;gap:7px;white-space:nowrap}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.tsep{flex:none;width:1px;background:var(--line);margin:10px 8px}
.badge{background:var(--accent);color:#fff;border-radius:99px;font:700 13px/1 var(--head);padding:3px 7px;letter-spacing:.04em}
.dot{width:10px;height:10px;border-radius:2px;background:var(--cat,var(--c-general));flex:none;display:inline-block}
main{padding-block:22px 60px}
.note{background:var(--tint);border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin-bottom:16px;font-size:15px}
.banner{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;justify-content:space-between;margin-bottom:16px}
.banner h2{font-size:clamp(30px,5vw,44px)}
.banner p{margin:4px 0 0;color:var(--muted);max-width:68ch}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:12px}
.bar .ttl{font:700 28px/1 var(--head);text-transform:uppercase;letter-spacing:.03em;min-width:190px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;padding:8px 16px;font:700 16px var(--head);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--navy);color:#fff}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 14px;font-weight:600}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.primary:hover{filter:brightness(1.1)}
.btn.good{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.danger{color:var(--accent-ink)}
.btn.sm{padding:5px 10px;font-size:14px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.sp{flex:1}
.layout{display:grid;grid-template-columns:minmax(0,1fr);gap:20px}
@media(min-width:1000px){.layout.side{grid-template-columns:minmax(0,1fr) 340px}}
.cal{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.dow{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));background:var(--navy);color:#fff}
.dow div{padding:8px 6px;font:700 15px var(--head);letter-spacing:.1em;text-transform:uppercase;text-align:center}
.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.cell{min-height:112px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:6px;display:flex;flex-direction:column;gap:4px;position:relative;background:var(--surface);min-width:0}
.cell:nth-child(7n){border-right:0}
.cell.out{background:var(--surface2)}
.cell.out .num{color:var(--muted);opacity:.7}
.cell.sel{outline:3px solid var(--accent);outline-offset:-3px}
.cell .top{display:flex;justify-content:space-between;align-items:center}
.num{font:700 17px/1 var(--head);width:26px;height:26px;display:grid;place-items:center;border-radius:50%}
.today .num{background:var(--accent);color:#fff}
.add{opacity:0;border:0;background:var(--surface2);border-radius:6px;width:24px;height:24px;line-height:1;font-weight:700;color:var(--muted)}
.cell:hover .add,.cell:focus-within .add,.cell.sel .add{opacity:1}
.chip{display:flex;align-items:center;gap:6px;border:0;text-align:left;width:100%;min-width:0;padding:3px 6px;border-radius:5px;background:color-mix(in srgb,var(--cat) 15%,var(--surface));font-size:13px;line-height:1.25;color:var(--ink)}
.chip .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.chip.done .t{text-decoration:line-through;opacity:.65}
.chip.post{border:1px dashed color-mix(in srgb,var(--cat) 60%,var(--line))}
.chip.okc{border:1.5px solid var(--ok)}
.chip:hover{background:color-mix(in srgb,var(--cat) 28%,var(--surface))}
.more{font-size:12px;color:var(--muted);padding-left:6px}
.dots{display:none;gap:3px;flex-wrap:wrap}
.wk{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.wcol{border-right:1px solid var(--line);min-height:380px;display:flex;flex-direction:column;min-width:0}
.wcol:last-child{border-right:0}
.whead{padding:8px;background:var(--surface2);border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
.whead b{font:700 18px var(--head);text-transform:uppercase;letter-spacing:.05em}
.wcol.today .whead{background:var(--accent);color:#fff}
.wbody{padding:8px;display:flex;flex-direction:column;gap:8px;flex:1}
.card{background:color-mix(in srgb,var(--cat) 12%,var(--surface));border:1px solid color-mix(in srgb,var(--cat) 35%,var(--line));border-radius:10px;padding:8px 10px;text-align:left;width:100%;display:block;min-width:0}
.card:hover{border-color:var(--cat)}
.card .h{font-weight:600;line-height:1.25;overflow-wrap:anywhere}
.card .m{font-size:13px;color:var(--muted);margin-top:2px;overflow-wrap:anywhere}
.card.done .h{text-decoration:line-through;opacity:.7}
.card.okc{border:2px solid var(--ok)}
.pill{display:inline-block;font:700 12px/1 var(--head);letter-spacing:.08em;text-transform:uppercase;padding:4px 7px;border-radius:99px;border:1px solid currentColor;white-space:nowrap}
.pill.todo{color:var(--muted)} .pill.prog{color:var(--warn)} .pill.done{color:var(--ok)} .pill.bad{color:var(--accent-ink)}
.catlab{font:700 13px var(--head);letter-spacing:.1em;text-transform:uppercase;display:inline-flex;align-items:center;gap:6px;color:var(--muted)}
@media(max-width:700px){
  .cell{min-height:58px;padding:4px}
  .chips{display:none}.dots{display:flex}.add{display:none}
  .dow div{font-size:13px;padding:6px 0;letter-spacing:.02em}
  .wk{grid-template-columns:1fr}
  .wcol{border-right:0;border-bottom:1px solid var(--line);min-height:0}
  .bar .ttl{min-width:0;width:100%}
}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:16px;min-width:0}
.panel h3{font-size:24px;margin-bottom:10px}
.panel .empty{color:var(--muted);font-size:15px;margin:0}
.list{display:flex;flex-direction:column;gap:8px}
.row{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:start;border:1px solid var(--line);border-radius:10px;padding:9px 11px;background:var(--surface);width:100%;text-align:left}
.row:hover{border-color:var(--muted)}
.row .tt{font-weight:600;overflow-wrap:anywhere}
.row .mm{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.row.done .tt{text-decoration:line-through;opacity:.7}
textarea.info{width:100%;min-height:120px;border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--bg);resize:vertical}
.hint{font-size:13px;color:var(--muted);margin:6px 0 0}

/* modal */
.scrim{position:fixed;inset:0;background:rgba(10,16,32,.6);display:grid;place-items:center;padding:16px;z-index:50;overflow:auto}
.modal{background:var(--surface);border:1px solid var(--line);border-radius:16px;width:min(560px,100%);padding:20px;max-height:calc(100vh - 32px);overflow:auto}
.modal.wide{width:min(1060px,100%)}
.modal h3{font-size:30px;margin-bottom:12px}
.f{display:grid;gap:12px;grid-template-columns:1fr 1fr}
.f .full{grid-column:1/-1}
@media(max-width:520px){.f{grid-template-columns:1fr}}
label{display:grid;gap:4px;font-size:13px;font-weight:600;color:var(--muted);letter-spacing:.02em}
input[type=text],input[type=date],input[type=time],input[type=number],input[type=search],input[type=url],select,textarea{width:100%;border:1px solid var(--line);border-radius:8px;padding:9px 10px;background:var(--bg);color:var(--ink);font-size:16px}
textarea{min-height:84px;resize:vertical}
.acts{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap;align-items:center}

/* photos */
.drop{border:2px dashed var(--line);border-radius:14px;padding:22px;text-align:center;background:var(--surface);margin-bottom:16px}
.drop.over{border-color:var(--accent);background:var(--tint)}

.mrow{margin:8px 0}
.mrow .ml{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin-bottom:3px;gap:8px}
.mrow .ml b{color:var(--ink)}
.mb{display:flex;gap:4px}
.mb i{flex:1;height:12px;border-radius:3px;border:1.5px solid var(--line);background:transparent}
.mb i.ap{background:var(--ok);border-color:var(--ok)}
.mb i.pn{background:color-mix(in srgb,var(--c-trips) 45%,transparent);border-color:var(--c-trips)}
.mb i.gp{border-color:var(--accent);border-style:dashed}
.wcard.gap .mb i{border-color:var(--accent)}

/* builder */
.bgrid{display:grid;gap:20px;grid-template-columns:minmax(0,1fr)}
@media(min-width:900px){.bgrid{grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr)}}
.thumbs{display:flex;flex-wrap:wrap;gap:8px}
.th{position:relative;width:78px;height:78px;border-radius:8px;overflow:hidden;background:var(--surface2);border:1px solid var(--line)}
.th img{width:100%;height:100%;object-fit:cover}
.th button{position:absolute;top:2px;right:2px;border:0;background:rgba(10,16,32,.75);color:#fff;border-radius:50%;width:20px;height:20px;line-height:1;font-size:13px}
.pick{display:grid;grid-template-columns:repeat(auto-fill,minmax(70px,1fr));gap:6px;max-height:170px;overflow:auto;margin-top:8px}
.pick button{border:2px solid transparent;padding:0;border-radius:6px;overflow:hidden;aspect-ratio:1;background:var(--surface2)}
.pick button:hover{border-color:var(--accent)}
.pick img{width:100%;height:100%;object-fit:cover}
.pvbox{position:sticky;top:8px}
.ig,.li{background:#fff;color:#14213D;border:1px solid #D5D9E2;border-radius:12px;overflow:hidden;max-width:420px;margin:0 auto;font-family:var(--body)}
.ig .hd,.li .hd{display:flex;gap:10px;align-items:center;padding:10px 12px}
.av{width:36px;height:36px;border-radius:50%;background:#14213D;display:grid;place-items:center;flex:none}
.av img{width:22px;height:22px}
.hd b{font-size:14px;line-height:1.2;display:block}
.hd small{font-size:12px;color:#5B6678;display:block}
.igimg{position:relative;aspect-ratio:4/5;background:#14213D;display:grid;place-items:center;color:#B4BECA;text-align:center;font:700 22px var(--head);text-transform:uppercase;letter-spacing:.05em}
.igimg img.cover{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.igimg .cnt{position:absolute;top:8px;right:8px;background:rgba(0,0,0,.6);color:#fff;font:600 12px var(--body);padding:2px 8px;border-radius:99px}
.igimg .nv{position:absolute;top:50%;transform:translateY(-50%);border:0;background:rgba(255,255,255,.85);color:#14213D;border-radius:50%;width:26px;height:26px;line-height:1}
.igact{padding:8px 12px 0;font-size:20px;letter-spacing:.3em}
.igcap{padding:4px 12px 12px;font-size:14px;line-height:1.4;white-space:pre-wrap;overflow-wrap:anywhere}
.igcap .tg{color:#2F66A8}
.li .tx{padding:0 12px 10px;font-size:14px;line-height:1.4;white-space:pre-wrap;overflow-wrap:anywhere}
.li .tx .tg{color:#2F66A8;font-weight:600}
.li img.cover{width:100%;height:auto;display:block;object-fit:contain}
.li .rx{display:flex;justify-content:space-around;padding:8px;border-top:1px solid #D5D9E2;font-size:13px;color:#5B6678;font-weight:600}
.status{border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:12px;background:var(--bg)}
.status h4{margin:0 0 8px;font:700 20px var(--head);text-transform:uppercase;letter-spacing:.04em}
.log{margin:8px 0 0;padding:0;list-style:none;font-size:13px;color:var(--muted);display:grid;gap:4px;max-height:140px;overflow:auto}
.log b{color:var(--ink)}
.res{display:grid;gap:12px;grid-template-columns:repeat(3,1fr)}
@media(max-width:520px){.res{grid-template-columns:1fr 1fr}}
.tpl{display:grid;gap:16px;grid-template-columns:minmax(0,1fr)}
@media(min-width:800px){.tpl{grid-template-columns:240px minmax(0,1fr)}}
.tl{display:flex;flex-direction:column;gap:6px}
.tl button{text-align:left;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:9px 11px}
.tl button[aria-pressed="true"]{border-color:var(--accent);background:var(--tint)}
.tl small{display:block;color:var(--muted);font-size:12px}
.prev{display:grid;gap:6px;margin-top:10px}
.prev div{display:grid;grid-template-columns:96px 1fr;gap:8px;font-size:14px;border:1px solid var(--line);border-radius:8px;padding:6px 9px;background:var(--bg)}
.ow{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));align-items:start}
.ow .panel{margin:0}
.bars{display:grid;gap:8px}
.bars .br{display:grid;grid-template-columns:130px 1fr 64px;gap:8px;align-items:center;font-size:14px}
.bars .tr{height:14px;background:var(--surface2);border-radius:4px;overflow:hidden}
.bars .tr i{display:block;height:100%;background:var(--navy)}
:root[data-theme="dark"] .bars .tr i{background:var(--c-case)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .bars .tr i{background:var(--c-case)}}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th,.tbl td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
.tbl th{font:700 14px var(--head);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.tbl td.n{text-align:right;font-variant-numeric:tabular-nums}
.scroll{overflow-x:auto}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--navy);color:#fff;padding:10px 18px;border-radius:99px;font-weight:600;z-index:80;box-shadow:0 6px 24px rgba(0,0,0,.3)}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
</style>
</head>

async function initStore(){
  try{S.db=await claude.use("db")}catch(e){S.db=null}
  try{S.assets=await claude.use("assets")}catch(e){S.assets=null}
  try{S.dl=await claude.use("downloads")}catch(e){S.dl=null}
  try{const u=await claude.use("user");if(u){try{const m=await u.me();if(m&&m.name){S.meName=m.name;if(!S.me){const pp=personByName(m.name);if(pp){S.me=pp.n;S.role=pp.r;renderRoleSel()}}}}catch(e){}const w=await u.can("data.write");if(w===false||w==="false")S.canWrite=false}}catch(e){}
  if(!S.db){S.offline=true;S.loaded=true;render(true);return}
  const t=setTimeout(()=>{if(!S.loaded){S.loaded=true;S.slow=true;render(true)}},10000);
  const done=()=>{clearTimeout(t);S.loaded=true;S.slow=false;render()};
  const err=e=>{S.loaded=true;S.err=e&&e.code;render()};
  Object.keys(KEY).forEach(col=>{
    S.db.collection(col).onSnapshot(s=>{
      let a=s.docs.map(d=>({id:d.id,...d.data()}));
      if(col==="photos"||col==="videos"||col==="library")a.sort((x,y)=>(y.created||0)-(x.created||0));
      S[KEY[col]]=a;done();
    },err);
  });
  S.db.collection("info").onSnapshot(s=>{S.info={};s.docs.forEach(d=>S.info[d.id]=d.data().text||"");render()},err);
}
async function saveDoc(col,id,data){
  const o={...data};delete o.id;
  if(S.offline){const arr=S[KEY[col]];const i=arr.findIndex(x=>x.id===id);const n={id,...o};if(i>=0)arr[i]=n;else arr.push(n);render(true);return true}
  try{await S.db.collection(col).doc(id).set(o);return true}catch(e){toast(e&&e.code==="invalid_argument"?"You need Contributor access to make changes.":"Could not save. Try again.");return false}
}
async function delDoc(col,id){
  if(S.offline){S[KEY[col]]=S[KEY[col]].filter(x=>x.id!==id);render(true);return}
  try{await S.db.collection(col).doc(id).delete()}catch(e){toast("Could not delete. Try again.")}
}

/* ---------- helpers ---------- */
function toast(msg){const el=document.createElement("div");el.className="toast";el.textContent=msg;$("#toastRoot").appendChild(el);setTimeout(()=>el.remove(),2800)}
const monthStart=d=>new Date(d.getFullYear(),d.getMonth(),1);
const weekStart=d=>addDays(new Date(d.getFullYear(),d.getMonth(),d.getDate()),-d.getDay());
const weekIso=s=>iso(weekStart(typeof s==="string"?pd(s):s));
function weekLabel(w){const a=pd(w),b=addDays(a,6);return MONTHS[a.getMonth()].slice(0,3)+" "+a.getDate()+" – "+(a.getMonth()!==b.getMonth()?MONTHS[b.getMonth()].slice(0,3)+" ":"")+b.getDate()}
function stat(s){return '<span class="pill '+(s||"todo")+'">'+STATUS[s||"todo"]+'</span>'}
const roleName=()=>S.me||(S.role==="advisor"?(S.meName||ADVISOR):(S.meName||ROLES[S.role]));
const isApprover=()=>S.role==="director"||S.role==="advisor";
const isApproved=p=>!!(p.approvals&&!p.changes&&(p.approvals.advisor||(laneOf(p)==="standard"&&p.approvals.director)));
const getWeek=w=>S.weeks.find(x=>x.id===w)||{id:w};
const weekPosts=w=>S.posts.filter(p=>p.date&&weekIso(p.date)===w);
function pushLog(o,action,comment){o.log=(o.log||[]).concat([{at:Date.now(),by:roleName(),role:S.role,action,comment:comment||""}]).slice(-40)}
function locked(p){return S.role==="member"&&p.date&&getWeek(weekIso(p.date)).submitted&&(p.stage==="review"||p.stage==="scheduled")&&!p.changes}
function ownersList(){const s=new Set(PEOPLE.filter(p=>p.r!=="advisor").map(p=>p.n));S.items.forEach(i=>i.owner&&s.add(i.owner));S.posts.forEach(i=>i.owner&&s.add(i.owner));return [...s].sort()}

/* calendar entries merge action items and posts */
function entries(){
  const a=S.items.map(i=>({...i,kind:"item"}));
  S.posts.forEach(p=>{if(p.date)a.push({kind:"post",id:p.id,title:(CH[p.channel]||CH.other).short+": "+(p.title||"Untitled post"),cat:p.cat||"general",date:p.date,time:p.time,status:p.stage==="posted"?"done":"todo",owner:p.owner,approved:isApproved(p),chg:!!p.changes,channel:p.channel,stage:p.stage})});
  return a;
}
function itemsOn(day){return entries().filter(i=>i.date===day&&(S.tab==="all"||i.cat===S.tab)&&whoOk(i.owner)).sort((a,b)=>(a.time||"99").localeCompare(b.time||"99"))}
function titleText(){
  if(S.view==="month")return MONTHS[S.anchor.getMonth()]+" "+S.anchor.getFullYear();
  const a=weekStart(S.anchor),b=addDays(a,6);
  return MONTHS[a.getMonth()].slice(0,3)+" "+a.getDate()+(a.getMonth()!==b.getMonth()?" – "+MONTHS[b.getMonth()].slice(0,3)+" "+b.getDate():" – "+b.getDate())+", "+b.getFullYear();
}

/* ---------- render ---------- */
function waitingCount(){
  if(S.role==="director")return S.posts.filter(p=>p.stage==="review"&&!p.changes&&!(p.approvals&&p.approvals.director)).length;
  if(S.role==="advisor")return S.posts.filter(p=>p.stage==="review"&&!p.changes&&!(p.approvals&&p.approvals.advisor)&&laneOf(p)==="special").length;
  return S.posts.filter(p=>p.changes).length;
}
function renderTabs(){
  const wc=waitingCount(),cur=topOf(S.tab).id;
  $("#tabs").innerHTML=TOP.map(t=>'<button class="tab" role="tab" data-act="top" data-id="'+t.id+'" aria-selected="'+(cur===t.id)+'">'+esc(t.name)+(t.id==="content"&&wc?' <span class="badge" title="Waiting on you">'+wc+'</span>':"")+'</button>').join("");
  const o=ownersList();$("#owners").innerHTML=o.map(x=>'<option value="'+esc(x)+'">').join("");
}
function render(force){
  const ae=document.activeElement;
  if(!force&&ae&&$("#app").contains(ae)&&/^(INPUT|TEXTAREA|SELECT)$/.test(ae.tagName)){S.dirty=true;renderTabs();return}
  S.dirty=false;renderTabs();
  let h="";
  if(S.offline)h+='<div class="note">You are not signed in, so changes will not be saved or shared. They disappear when you close this page.</div>';
  if(S.slow)h+='<div class="note">The shared data is taking a while to load. What you see may be out of date.</div>';
  if(!S.canWrite&&!S.offline)h+='<div class="note">You can view everything here. Ask the page owner for Contributor access to add or edit items.</div>';
  const v={photos:photosView,videos:videosView,projects:projectsView,team:teamView,messaging:messagingView,brain:brainView,branding:brandView,content:contentView,approvals:approvalsView,thisweek:thisWeekView,results:resultsView}[S.tab];
  h+=subNav()+peopleBar()+(v?v():calView());
  $("#app").innerHTML=h;
  if($("#dock")&&$("#dock").classList.contains("open"))drawDock();
}
function subNav(){
  const t=topOf(S.tab);if(t.views.length<2)return"";
  if(t.id==="cal")return '<div class="subnav" role="group" aria-label="Show on the calendar"><span class="cl">Show</span>'+t.views.map(v=>'<button class="fchip" data-act="tab" data-id="'+v[0]+'" aria-pressed="'+(S.tab===v[0])+'">'+(CAT[v[0]]?'<span class="dot" style="--cat:'+catVar(v[0])+'"></span>':"")+esc(v[1])+'</button>').join("")+'<span class="cl" style="margin-left:6px">Posts show with a dashed outline</span></div>';
  const wc=waitingCount();
  return '<div class="subnav"><div class="seg" role="group" aria-label="'+esc(t.name)+' views">'+t.views.map(v=>'<button data-act="tab" data-id="'+v[0]+'" aria-pressed="'+(S.tab===v[0])+'">'+esc(v[1])+(v[0]==="approvals"&&wc?' <span class="badge">'+wc+'</span>':"")+'</button>').join("")+'</div></div>';
}
document.addEventListener("focusout",()=>{setTimeout(()=>{if(S.dirty&&!(document.activeElement&&$("#app").contains(document.activeElement)&&/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName)))render(true)},60)});

function chip(i){const post=i.kind==="post";return '<button class="chip'+(i.status==="done"?" done":"")+(post?" post":"")+(i.approved?" okc":"")+'" style="--cat:'+catVar(i.cat)+'" data-act="'+(post?"editpost":"edit")+'" data-id="'+i.id+'"><span class="dot"></span>'+(i.owner?av(i.owner,16):"")+'<span class="t">'+(i.time?esc(fmtTime(i.time))+" ":"")+esc(i.title)+'</span>'+(i.approved?'<span style="color:var(--ok)">'+CHECK+'</span>':"")+'</button>'}
function monthGrid(){
  const first=monthStart(S.anchor),start=addDays(first,-first.getDay());
  const last=new Date(first.getFullYear(),first.getMonth()+1,0);
  const weeks=Math.ceil((first.getDay()+last.getDate())/7);
  let h='<div class="cal"><div class="dow">'+DOW.map(d=>"<div>"+d+"</div>").join("")+'</div><div class="grid">';
  for(let i=0;i<weeks*7;i++){
    const d=addDays(start,i),k=iso(d),its=itemsOn(k);
    h+='<div class="cell'+(d.getMonth()!==first.getMonth()?" out":"")+(k===todayIso?" today":"")+(k===S.sel?" sel":"")+'" data-act="sel" data-date="'+k+'" tabindex="0" role="gridcell" aria-label="'+esc(fmtDate(k))+', '+its.length+' items">'
     +'<div class="top"><span class="num">'+d.getDate()+'</span>'+(S.canWrite?'<button class="add" data-act="new" data-date="'+k+'" aria-label="Add item on '+esc(fmtDate(k))+'">+</button>':"")+'</div>'
     +'<div class="chips">'+its.slice(0,3).map(chip).join("")+(its.length>3?'<div class="more">+'+(its.length-3)+' more</div>':"")+'</div>'
     +'<div class="dots">'+its.slice(0,6).map(i=>'<span class="dot" style="--cat:'+catVar(i.cat)+'"></span>').join("")+'</div></div>';
  }
  return h+"</div></div>";

     +its.map(i=>'<button class="card'+(i.status==="done"?" done":"")+(i.approved?" okc":"")+'" style="--cat:'+catVar(i.cat)+'" data-act="'+(i.kind==="post"?"editpost":"edit")+'" data-id="'+i.id+'"><div class="h">'+esc(i.title)+'</div>'
        +'<div class="m">'+[i.time?fmtTime(i.time):"",i.location,i.owner].filter(Boolean).map(esc).join(" · ")+'</div>'

function rowItem(i){const post=i.kind==="post";return '<button class="row'+(i.status==="done"?" done":"")+'" data-act="'+(post?"editpost":"edit")+'" data-id="'+i.id+'"><span class="dot" style="--cat:'+catVar(i.cat)+';margin-top:6px"></span><span><span class="tt">'+esc(i.title)+'</span><br><span class="mm">'+[i.time?fmtTime(i.time):"",i.location,i.owner,(S.tab==="all"?(CAT[i.cat]||CAT.general).name:"")].filter(Boolean).map(esc).join(" · ")+'</span>'+(i.deliverable?'<br><span class="mm">Deliverable: '+esc(i.deliverable)+'</span>':"")+'</span>'+(post?'<span class="pill '+(i.chg?"bad":i.approved?"done":"todo")+'">'+(i.chg?"Changes":i.approved?"Approved":"Post")+'</span>':stat(i.status))+'</button>'}

/* ---------- posts: cards, goals, mix ---------- */
function stepChips(p){
  const a=p.approvals||{},lane=laneOf(p),hrs=reviewHrs(p);
  return '<div class="steps"><span class="step lane" title="'+esc(LANE[lane].note)+'">'+(lane==="standard"?"Standard":"Special")+'</span>'
   +'<span class="step '+(a.director?"ok":"wait")+'" title="'+esc(a.director?a.director.by+" · "+fmtStamp(a.director.at):(a.advisor?"Skipped, final approval given":"Waiting on a director"))+'">Director'+(a.director?" ✓":"")+'</span>'
   +(lane==="special"||a.advisor?'<span class="step '+(a.advisor?"ok":"wait")+'" title="'+esc(a.advisor?a.advisor.by+" · "+fmtStamp(a.advisor.at):"Waiting")+'">'+ADVISOR.split(" ")[0]+(a.advisor?" ✓":"")+'</span>':"")
   +(hrs!==null?'<span class="step '+(hrs>=REVIEW_SLA?"bad":"wait")+'" title="Reviews are due within '+REVIEW_SLA+' hours">'+(hrs>=REVIEW_SLA?"Overdue ":"In review ")+hrs+'h</span>':"")+'</div>';
}
function pcard(p,o){
  o=o||{};const appr=isApproved(p)&&p.stage!=="posted",chg=!!p.changes,ch=CH[p.channel]||CH.other;
  const stg=(STAGES.find(s=>s.id===p.stage)||STAGES[0]).name;
  let h='<div class="pwrap"><button class="pcard'+(appr?" appr":"")+(chg?" chg":"")+'" data-act="editpost" data-id="'+p.id+'">'+(appr?'<span class="checkb" aria-label="Approved">'+CHECK+'</span>':"")
   +'<div class="body"><div style="margin-bottom:6px"><span class="chtag">'+esc(ch.name)+'</span> <span class="catlab">'+esc(p.type||"")+'</span>'+pillarDots(p)+'</div>'
   +'<div class="h">'+esc(p.title||"Untitled post")+'</div>'
   +(appr?'<div class="when">Posts '+esc(fmtDate(p.date))+(p.time?" at "+esc(fmtTime(p.time)):"")+'</div>':'<div class="m">'+(p.date?esc(fmtDate(p.date))+(p.time?" · "+esc(fmtTime(p.time)):""):"No date set")+'</div>')
   +'<div class="m">'+[p.owner||"No owner",stg].map(esc).join(" · ")+'</div>'+(o.noSteps?"":stepChips(p))+'</div>'
   +(chg?'<div class="cnote"><b>Changes requested by '+esc(p.changes.by)+'</b>'+esc(p.changes.comment||"No comment")+'</div>':"")+'</button>';
  return h+'<div class="orow">'+ownerCtl("post",p.id,p.owner)+'</div>'+(o.actions||"")+'</div>';
}
function approvalActions(p){
  const kitBtn='<button class="btn sm" data-act="kit" data-id="'+p.id+'">Posting kit</button>';
  if(!S.canWrite)return(p.photoIds&&p.photoIds.length||p.video)?'<div class="pact">'+kitBtn+'</div>':"";
  let b=(p.photoIds&&p.photoIds.length||p.video)?kitBtn:"";
  const a=p.approvals||{};
  if(p.stage==="review"&&!p.changes){
    if(S.role==="director"&&!a.director&&!a.advisor)b+='<button class="btn good sm" data-act="approve" data-lv="director" data-id="'+p.id+'">Approve</button>';
    if(S.role==="advisor"&&!a.advisor)b+='<button class="btn good sm" data-act="approve" data-lv="advisor" data-id="'+p.id+'">'+(a.director?"Give final approval":"Approve (final)")+'</button>';
    if(isApprover())b+='<button class="btn sm" data-act="reqchg" data-id="'+p.id+'">Request changes</button>';
  }
  if(S.role==="member"&&p.changes)b+='<button class="btn primary sm" data-act="resubmit" data-id="'+p.id+'">Request approval again</button>';
  if(S.role==="member"&&(p.stage==="drafting"||p.stage==="idea")&&!p.changes)b+='<button class="btn sm" data-act="tore" data-id="'+p.id+'">Send to review</button>';
  if(isApproved(p)&&p.stage!=="posted"&&S.role==="member")b+='<button class="btn sm" data-act="markposted" data-id="'+p.id+'">Mark posted</button>';
  return b?'<div class="pact">'+b+'</div>':"";
}
function weekStats(w){
  const ps=weekPosts(w),o={};
  Object.keys(GOALS).forEach(c=>{const l=ps.filter(p=>p.channel===c);o[c]={ap:l.filter(p=>isApproved(p)||p.stage==="posted").length,pl:l.filter(p=>p.stage!=="idea").length,all:l.length}});
  o.ap=ps.filter(p=>isApproved(p)||p.stage==="posted").length;o.total=ps.length;
  const days=Math.round((pd(w)-pd(todayIso))/864e5);o.days=days;o.gap=(days<=7&&o.ap===0);o.past=days<-6;
  return o;
}
function meterRow(c,st){
  const[min,max]=GOALS[c],s=st[c],n=Math.max(max,s.pl,s.ap);let seg="";
  for(let i=0;i<n;i++)seg+='<i class="'+(i<s.ap?"ap":i<s.pl?"pn":(st.gap&&i<min?"gp":""))+'"></i>';

async function doChanges(id,comment){

  let blocked=0;for(const p of ps){const ok=await doStage(p.id,"review","");if(ok===false)blocked++}
  if(blocked){toast(blocked+" post"+(blocked>1?"s need":" needs")+" the quality check finished first. Open each one to complete it.");return}

function clientHits(text){const t=String(text||"").toLowerCase();if(t.length<4)return[];return MSG.clients.filter(c=>c.keys.some(k=>t.includes(k)))}
const EMOJI=/\p{Extended_Pictographic}/u;
function pillarDots(p){const a=(p.pillars||[]).filter(x=>PILLAR[x]);return a.length?' '+a.map(x=>'<span class="pdot" style="background:'+PILLAR[x].color+'" title="'+esc(PILLAR[x].name)+'"></span>').join(""):""}
function pillarNames(ids){return (ids||[]).filter(x=>PILLAR[x]).map(x=>'<span class="ptag"><span class="pdot" style="background:'+PILLAR[x].color+'"></span>'+esc(PILLAR[x].name)+'</span>').join(" ")}
function msgWarn(d){
  const hits=clientHits(postText(d)),w=[];
  if(hits.length)w.push('<b>Client named: '+esc(hits.map(c=>c.name).join(", "))+'.</b> '+esc(MSG.clientRule)+' This post goes in the Special lane.');
  if(EMOJI.test((d.caption||"")+(d.hashtags||"")))w.push('<b>Emoji found.</b> The voice guide says no emojis for now.');
  if(!(d.pillars||[]).length)w.push('<b>No pillar picked.</b> Tag at least one so the pillar balance stays accurate.');
  return w.length?'<div class="mwarn">'+w.map(x=>'<div>'+x+'</div>').join("")+'</div>':"";
}
function drawMsg(){
  const el=$("#b_msgbox");if(!el||!B)return;const ro=lockedB(),T=CTYPE[B.ctype],dis=ro?" disabled":"";

  if(T)h+='<p class="hint" style="margin:6px 0 0">'+esc(T.d)+' <b>Copy tip:</b> '+esc(T.hint)+' <b>CTA:</b> '+esc(T.cta)+'</p>';

  h+='<div class="chips"><span class="cl">Audience</span>'+MSG.audiences.map(a=>{const on=B.aud.includes(a.id);return '<button type="button" class="pchip'+(on?" on":"")+'" data-act="baud" data-id="'+a.id+'" aria-pressed="'+on+'"'+dis+'>'+esc(a.name)+'</button>'}).join("")+'</div>';
  if(!ro){const pr=MSG.proof.filter(x=>!B.pillars.length||x.p.some(y=>B.pillars.includes(y)));
    h+='<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:8px"><select id="b_proof" style="flex:1;min-width:180px" aria-label="Verified proof point"><option value="">Add a verified proof point…</option>'+pr.map(x=>'<option value="'+x.id+'">'+esc(x.text.length>72?x.text.slice(0,72)+"…":x.text)+'</option>').join("")+'</select><button class="btn sm" type="button" data-act="bproof">Add to caption</button></div>'}
  h+='<label style="margin-top:8px">Project<select id="b_proj"'+dis+'><option value="">No project</option>'+S.projects.map(x=>'<option value="'+x.id+'"'+(B.project===x.id?" selected":"")+'>'+esc(x.name||"Untitled project")+'</option>').join("")+'</select></label>';
  el.innerHTML=h+'</div>';
}
function pillarPanel(){
  const since=iso(addDays(new Date(),-28)),ps=S.posts.filter(p=>p.stage!=="posted"||(p.date&&p.date>=since));
  const n=Object.fromEntries(MSG.pillars.map(p=>[p.id,0]));let none=0;
  ps.forEach(p=>{const a=(p.pillars||[]).filter(x=>PILLAR[x]);if(!a.length)none++;a.forEach(x=>n[x]++)});
  const max=Math.max(1,...Object.values(n)),zero=MSG.pillars.filter(p=>!n[p.id]);
  return '<div class="panel"><h3>Pillar balance</h3><p class="hint" style="margin:0 0 10px">Planned posts plus the last 4 weeks, by messaging pillar. A post can count toward more than one.</p>'
   +MSG.pillars.map(p=>'<div class="pb"><span><span class="pdot" style="background:'+p.color+'"></span>'+esc(p.name)+'</span><div class="tr"><i style="width:'+Math.round(n[p.id]/max*100)+'%;background:'+p.color+'"></i></div><b>'+n[p.id]+'</b></div>').join("")
   +(ps.length&&zero.length?'<div class="mwarn" style="margin-top:10px"><div><b>Nothing planned for:</b> '+esc(zero.map(p=>p.name).join(", "))+'.</div></div>':"")
   +(none?'<p class="hint" style="margin:8px 0 0">'+none+' post'+(none>1?"s have":" has")+' no pillar yet. Open '+(none>1?"them":"it")+' and tag one.</p>':"")+'</div><div style="height:16px"></div>';
}

function teamView(){
  const first=n=>String(n||"").trim().split(/\s+/)[0].toLowerCase();

  const revDir=S.posts.filter(p=>p.stage==="review"&&!p.changes&&!(p.approvals||{}).director&&!(p.approvals||{}).advisor).length;
  const revAdv=S.posts.filter(p=>p.stage==="review"&&!p.changes&&!(p.approvals||{}).advisor&&laneOf(p)==="special").length;

    const posts=mine(p.n,S.posts).filter(x=>x.stage!=="posted"),projs=mine(p.n,S.projects).filter(x=>x.status!=="done"),todo=mine(p.n,S.items).filter(x=>x.status!=="done"),chg=posts.filter(x=>x.changes).length;

     +(chg?'<p style="color:var(--red);font-weight:700">'+chg+' post'+(chg>1?"s":"")+' with changes requested</p>':"")
     +'<p><b>Posts in progress ('+posts.length+')</b></p>'+(posts.length?'<div class="list" style="gap:4px">'+posts.slice(0,5).map(x=>'<button class="row" style="grid-template-columns:1fr auto" data-act="editpost" data-id="'+x.id+'"><span class="tt">'+esc(x.title||"Untitled post")+'</span><span class="mm">'+esc((STAGES.find(s=>s.id===x.stage)||STAGES[0]).name)+'</span></button>').join("")+'</div>':'<p class="hint" style="margin:0">None.</p>')

/* ---------- people: colors, owner pills, claim, picker, filter, timelines ---------- */
const PCOLORS=["#E4002B","#2A6F97","#C98A00","#1F7A4D","#7A3E9D","#D9480F","#0B7285","#A61E4D","#5C7CFA","#2B8A3E"];
function personColor(n){const i=PEOPLE.findIndex(p=>p.n.toLowerCase()===String(n||"").trim().toLowerCase());if(i>=0)return PCOLORS[i%PCOLORS.length];let h=0;for(const ch of String(n||""))h=(h*31+ch.charCodeAt(0))>>>0;return PCOLORS[h%PCOLORS.length]}
const firstName=n=>String(n||"").trim().split(/\s+/)[0];
const initials=n=>String(n||"?").trim().split(/\s+/).map(w=>w[0]).join("").slice(0,2).toUpperCase();
function sameOwner(o,n){o=String(o||"").trim().toLowerCase();n=String(n||"").trim().toLowerCase();if(!o||!n)return false;return o===n||o.split(/\s+/)[0]===n.split(/\s+/)[0]}
const fullName=o=>{const p=PEOPLE.find(q=>sameOwner(o,q.n));return p?p.n:String(o||"")};
const whoOk=o=>!S.who||sameOwner(o,S.who);
function av(n,sz){const fn=fullName(n),ph=FACE[fn];return '<span class="av3'+(ph?" ph":"")+'" style="--oc:'+personColor(n)+(sz?';width:'+sz+'px;height:'+sz+'px;font-size:'+Math.round(sz*.42)+'px':"")+'" title="'+esc(fn)+'">'+(ph?'<img alt="" src="'+ph+'">':esc(initials(fn)))+'</span>'}
function ownerCtl(kind,id,owner){
  if(owner)return '<button class="opill3" style="--oc:'+personColor(owner)+'" data-act="pickown" data-k="'+kind+'" data-id="'+id+'" title="Change owner"'+(S.canWrite?"":" disabled")+'>'+av(owner,20)+esc(firstName(fullName(owner)))+'</button>';
  if(!S.canWrite)return '<span class="onone">No owner</span>';
  return (S.me?'<button class="claim3" data-act="claim" data-k="'+kind+'" data-id="'+id+'">I\'ll take it</button>':"")+'<button class="obtn3" data-act="pickown" data-k="'+kind+'" data-id="'+id+'">+ Owner</button>';
}

function closePicker(){const p=$("#ownPop");if(p)p.hidden=true}
function peopleBar(){
  if(!["thisweek","all","content","projects",...CATS.map(c=>c.id)].includes(S.tab)||(S.tab==="projects"&&S.proj))return"";
  const ps=PEOPLE;
  return '<div class="pbar3" role="group" aria-label="Filter by person"><button class="pchip3'+(S.who?"":" on")+'" data-act="who" data-id="" aria-pressed="'+!S.who+'">Everyone</button>'
   +ps.map(p=>'<button class="pchip3'+(sameOwner(S.who,p.n)?" on":"")+'" data-act="who" data-id="'+esc(p.n)+'" aria-pressed="'+sameOwner(S.who,p.n)+'" style="--oc:'+personColor(p.n)+'">'+av(p.n,20)+esc(firstName(p.n))+'</button>').join("")+'</div>';

function personWork(n){
  const out=[];
  S.items.forEach(i=>{if(sameOwner(i.owner,n))out.push({kind:"item",id:i.id,title:i.title||"Untitled item",date:i.date||"",time:i.time||"",done:i.status==="done",sub:(CAT[i.cat]||CAT.general).name+(i.deliverable?" · "+i.deliverable:"")})});
  S.posts.forEach(p=>{if(sameOwner(p.owner,n))out.push({kind:"post",id:p.id,title:(CH[p.channel]||CH.other).short+": "+(p.title||"Untitled post"),date:p.date||"",time:p.time||"",done:p.stage==="posted",sub:p.changes?"Changes requested":isApproved(p)?"Approved":(STAGES.find(s=>s.id===p.stage)||STAGES[0]).name})});
  S.projects.forEach(x=>{if(sameOwner(x.owner,n))out.push({kind:"proj",id:x.id,title:"Project: "+(x.name||"Untitled"),date:"",time:"",done:x.status==="done",sub:VSTEPS[vStage(x)]})});
  return out;
}
function dayLabel(d){if(!d)return"No date";if(d===todayIso)return"Today";if(d===iso(addDays(pd(todayIso),1)))return"Tomorrow";if(d<todayIso)return"Overdue · "+fmtDate(d);return fmtDate(d)}
function drawDock(){
  const dk=$("#dock");if(!dk)return;const n=S.dockWho||S.me||PEOPLE[0].n;
  $("#dtabs3").innerHTML=PEOPLE.map(p=>'<button role="tab" aria-selected="'+sameOwner(n,p.n)+'" data-act="dockwho" data-id="'+esc(p.n)+'" style="--oc:'+personColor(p.n)+'">'+esc(firstName(p.n))+'</button>').join("");
  const work=personWork(n),open=work.filter(w=>!w.done),dated=open.filter(w=>w.date).sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time)),undated=open.filter(w=>!w.date),done=work.filter(w=>w.done).length;
  const p=PEOPLE.find(q=>sameOwner(n,q.n));
  let h='<div style="display:flex;gap:12px;align-items:center">'+av(n,52)+'<div><h3 style="margin:0">'+esc(fullName(n))+'</h3><p class="mm" style="margin:2px 0 0">'+esc(p?ROLES[p.r]:"")+' · '+open.length+' open · '+done+' done</p></div></div>';
  if(S.canWrite&&!sameOwner(n,S.me)&&S.me)h+='<p class="hint" style="margin:8px 0 0">Viewing '+esc(firstName(n))+'\'s timeline.</p>';
  let last=null;
  h+='<div class="tl3">'+(dated.length||undated.length?dated.map(w=>{let hd="";const lab=dayLabel(w.date),key=w.date<todayIso?"over":w.date;if(key!==last){hd='<div class="tday3'+(w.date<todayIso?" over":"")+'">'+esc(w.date<todayIso?"Overdue":lab)+'</div>';last=key}return hd+tlRow(w)}).join("")+(undated.length?'<div class="tday3">No date</div>'+undated.map(tlRow).join(""):""):'<p class="empty">Nothing on '+esc(firstName(n))+'\'s plate. Claim something with "I\'ll take it".</p>')+'</div>';
  $("#dbody3").innerHTML=h;
}
function tlRow(w){
  const open=w.kind==="post"?"editpost":w.kind==="item"?"edit":"openproj";
  return '<div class="tli3">'+(w.kind==="item"&&S.canWrite?'<button class="tdot3" data-act="itemdone" data-id="'+w.id+'" title="Mark done" aria-label="Mark '+esc(w.title)+' done"></button>':'<span class="tdot3 '+w.kind+'"></span>')+'<button class="tlb" data-act="'+open+'" data-id="'+w.id+'"><b>'+esc(w.title)+'</b><span>'+esc([w.date&&w.date<todayIso?fmtDate(w.date):"",w.time?fmtTime(w.time):"",w.sub].filter(Boolean).join(" · "))+'</span></button></div>';

function toggleDock(open){const dk=$("#dock");if(!dk)return;const o=open==null?!dk.classList.contains("open"):open;dk.classList.toggle("open",o);$("#dtab3").setAttribute("aria-expanded",String(o));if(o)drawDock()}

/* ---------- video workspace: idea, brief, footage, cuts, feedback, approval, post ---------- */
const PLAT=[["reels","Instagram Reel","9:16"],["linkedin","LinkedIn video","4:5"],["story","Instagram Story","9:16"],["youtube","YouTube","16:9"]];
const PLATN=Object.fromEntries(PLAT.map(p=>[p[0],p[1]+" ("+p[2]+")"]));
const VSTEPS=["Idea","Brief","Footage","Cuts","Approved","Posted"];
const projCuts=id=>S.cuts.filter(c=>c.project===id).sort((a,b)=>(b.created||0)-(a.created||0));
function vStage(x){const cuts=projCuts(x.id),posts=S.posts.filter(p=>p.project===x.id);
  return posts.some(p=>p.stage==="posted")?5:cuts.some(c=>c.status==="approved")?4:cuts.length?3:(x.footage||x.clips)?2:x.brief?1:0}
function vStepper(x){const d=pDone(x),st=pCur(x);return '<div class="vstep" aria-label="Step: '+PSTEPS[st]+'">'+PSTEPS.map((s,i)=>'<span class="'+(d[i]?"done":i===st?"cur":"")+'">'+s+'</span>').join("")+'</div>'}
const fmtSec=t=>Math.floor(t/60)+":"+String(Math.floor(t%60)).padStart(2,"0");
function briefText(x){
  const T=CTYPE[x.ctype],L=[];
  L.push("GSCG VIDEO BRIEF: "+(x.name||"Untitled project"));
  if(x.owner)L.push("Owner: "+x.owner);
  if(T)L.push("Content type: "+T.name+". "+T.d);
  if((x.platforms||[]).length)L.push("Deliver: "+x.platforms.map(p=>PLATN[p]||p).join(", "));
  if(x.footage)L.push("Footage: "+x.footage);
  L.push("","Brief:",x.brief||"(no brief yet)");
  const qa=x.qa||{};if(PQS.some(q=>qa[q.k]))L.push("","Answers:",...PQS.filter(q=>qa[q.k]).map(q=>"- "+q.q+" "+qa[q.k]));
  if(T&&T.shots)L.push("","Shot list:",...T.shots.map(s=>"- "+s[0]+" ("+s[1]+"): "+s[2]));
  if(T)L.push("","Copy tip: "+T.hint,"Call to action: "+T.cta);
  const pl=(x.pillars||[]).filter(p=>PILLAR[p]);if(pl.length)L.push("","Pillars: "+pl.map(p=>PILLAR[p].name+" ("+PILLAR[p].promise+")").join("; "));
  L.push("","Brand: navy #14213D, red #E4002B, cream #F5F3EE. Barlow Condensed headlines in caps, Barlow body. White logo on navy or red.");
  L.push("Voice: "+MSG.voice.do.join("; ")+". Never: "+MSG.voice.dont.join("; ")+".");
  L.push("Client names: "+MSG.clientRule);
  return L.join("\n");
}
const PSTEPS=["Footage","What we're making","Questions","Build","Review","Post"];
const PQS=[
 {k:"moments",q:"Which moments have to be in it?",ph:"The presentation, the stadium tour, the group photo…"},
 {k:"people",q:"Who is on camera, and has everyone agreed to be posted?",ph:"Names, and yes or no on consent"},
 {k:"clients",q:"Does it show or name a client? Which ones?",ph:"Client names, logos on screen, or none"},
 {k:"sound",q:"Music, voice, or both? Any lines that must be heard?",ph:"Upbeat music under, one interview line…"},
 {k:"length",q:"How long, and when does it need to post?",ph:"30 seconds, posting Tuesday at noon"}
];
function pDone(x){const cuts=projCuts(x.id),qa=x.qa||{};return[
  !!(x.footage||x.clips),
  !!(x.ctype&&String(x.brief||"").trim()&&(x.platforms||[]).length),
  PQS.every(q=>String(qa[q.k]||"").trim()),
  cuts.length>0,
  cuts.some(c=>c.status==="approved"),
  S.posts.some(p=>p.project===x.id)
]}
function pCur(x){const d=pDone(x),i=d.indexOf(false);return i<0?5:i}
function projectDetail(x){
  S.pstep=S.pstep||{};const done=pDone(x),cur=S.pstep[x.id]!=null?S.pstep[x.id]:pCur(x),w=S.canWrite,T=CTYPE[x.ctype];
  const made=x.created?fmtDate(iso(new Date(x.created))):"";
  let h='<div class="pkick">Project'+(made?" · "+esc(made):"")+'</div><h2 class="ptitle">'+esc(x.name||"Untitled project")+'</h2>'
   +'<div class="pmeta"><span class="mm">Owner</span>'+ownerCtl("proj",x.id,x.owner)+'<button class="btn sm" data-act="projback">‹ All projects</button>'+(w?'<button class="btn sm" data-act="editproj" data-id="'+x.id+'">Edit project</button>':"")+'</div>';
  if(String(x.brief||"").trim())h+='<blockquote class="pquote">“'+esc(x.brief)+'”</blockquote>';
  h+='<div class="psteps" role="tablist" aria-label="Project steps">'+PSTEPS.map((s,i)=>'<button role="tab" class="pst'+(done[i]?" ok":"")+(i===cur?" cur":"")+'" aria-selected="'+(i===cur)+'" data-act="pstep" data-id="'+x.id+'" data-i="'+i+'"><small>Step '+(i+1)+'</small><b>'+(done[i]?"✓ ":"")+esc(s)+'</b></button>').join("")+'</div>';
  h+='<div class="panel pstage"><div class="pkick">Step '+(cur+1)+' · '+esc(PSTEPS[cur])+'</div>'+[stFootage,stMaking,stQuestions,stBuild,stReview,stPost][cur](x,w,T)+'</div>';
  h+='<div class="acts" style="justify-content:space-between">'+(cur>0?'<button class="btn" data-act="pstep" data-id="'+x.id+'" data-i="'+(cur-1)+'">‹ '+esc(PSTEPS[cur-1])+'</button>':'<span></span>')+(cur<5?'<button class="btn primary" data-act="pstep" data-id="'+x.id+'" data-i="'+(cur+1)+'">'+esc(PSTEPS[cur+1])+' ›</button>':"")+'</div>';
  return h;
}
function stFootage(x,w){

   +(T?'<div class="fmtbox" style="margin-top:12px"><b>'+esc(T.name)+'</b><p class="hint" style="margin:4px 0 0">'+esc(T.d)+' <b>Copy tip:</b> '+esc(T.hint)+' <b>CTA:</b> '+esc(T.cta)+'</p>'+(T.shots?'<ol style="margin:8px 0 0;padding-left:20px;font-size:14px">'+T.shots.map(s=>'<li><b>'+esc(s[0])+'</b> ('+esc(s[1])+'): '+esc(s[2])+'</li>').join("")+'</ol>':"")+'<p style="margin:8px 0 0">'+pillarNames(T.p)+'</p></div>':"")

function stQuestions(x,w){

   +(clientHits(Object.values(qa).join(" ")).length?'<div class="mwarn"><div><b>Client named: '+esc(clientHits(Object.values(qa).join(" ")).map(c=>c.name).join(", "))+'.</b> '+esc(MSG.clientRule)+'</div></div>':"")
   +(w?'<div class="acts"><button class="btn primary sm" data-act="pqsave" data-id="'+x.id+'">Save answers</button></div>':"");

function stBuild(x,w){

  if(cuts.length)h+='<p style="margin-top:14px"><b>Cuts so far</b></p><div class="cutgrid">'+cuts.map(c=>'<div class="cutmini">'+(cutPoster(c)?'<img alt="" src="'+esc(cutPoster(c))+'">':'<div class="cm0">No cover</div>')+'<b>'+esc(c.title||"Cut")+'</b><span>'+esc(PLATN[c.platform]||"")+'</span><span class="pill '+(c.status==="approved"?"done":c.status==="changes"?"bad":"prog")+'">'+(c.status==="approved"?"Approved":c.status==="changes"?"Changes":"In review")+'</span></div>').join("")+'</div>';

function stReview(x){
  const cuts=projCuts(x.id);
  return '<h3 class="pst-h">Review</h3><p class="hint" style="margin:0 0 10px">Leave feedback pinned to a moment in the video. A director or '+esc(ADVISOR)+' approves the cut or asks for changes; changes mean a new cut in Build.</p>'
   +(cuts.length?cuts.map(cutCard).join(""):'<p class="empty">No cuts to review yet. Add one in Build.</p>');

function stPost(x,w,T){

     +(already?'<p style="margin:6px 0">Post created: <button class="btn sm" data-act="editpost" data-id="'+already.id+'">'+esc(already.title||"Open post")+'</button> <span class="mm">'+esc((STAGES.find(s=>s.id===already.stage)||STAGES[0]).name)+'</span></p>'

async function pkMake(cid){

async function saveProj(id,patch,msg){const x=S.projects.find(q=>q.id===id);if(!x)return;if(await saveDoc("projects",id,{...x,...patch,updated:Date.now()})){render(true);toast(msg||"Saved")}}
const cutPoster=c=>c.stillId?"blob/"+c.stillId:(c.poster||"");
function cutCard(c){
  const st=c.status||"review",pill=st==="approved"?'<span class="pill done">Approved</span>':st==="changes"?'<span class="pill bad">Changes requested</span>':'<span class="pill prog">In review</span>';
  const pst=cutPoster(c),media=(c.assetId||c.src)?'<video id="cv_'+c.id+'" controls playsinline preload="metadata" src="'+esc(c.assetId?"blob/"+c.assetId:c.src)+'"'+(pst?' poster="'+esc(pst)+'"':"")+'></video>':pst?'<img class="cv" alt="Cover still for '+esc(c.title||"cut")+'" src="'+esc(pst)+'">':"";
  let h='<div class="mcard cutc'+(st==="changes"?" chgc":"")+'" style="margin-bottom:12px"><div class="ckh"><h4 style="margin:0">'+esc(c.title||"Cut")+'</h4>'+pill+'</div><p class="mm" style="display:flex;gap:6px;align-items:center;flex-wrap:wrap">'+av(c.by,20)+esc(PLATN[c.platform]||"")+' · added by '+esc(c.by||"someone")+' · '+esc(fmtStamp(c.created||0))+'</p>'+media
   +(c.link?'<p><a href="'+esc(c.link)+'" target="_blank" rel="noopener">Watch the full cut</a></p>':(!c.assetId&&!c.src?'<p class="hint">Only the cover is stored. Add a link to the full cut so reviewers can watch it.</p>':""));

function captureStill(src){
  return new Promise(res=>{
    const v=document.createElement("video");v.muted=true;v.defaultMuted=true;v.playsInline=true;
    v.setAttribute("playsinline","");v.setAttribute("muted","");v.preload="metadata";
    v.style.cssText="position:fixed;left:-9999px;top:0;width:2px;height:2px;opacity:0;pointer-events:none";
    document.body.appendChild(v);let done=false,tried=false;
    const fin=b=>{if(done)return;done=true;try{v.pause()}catch(e){}try{v.removeAttribute("src");v.load()}catch(e){}v.remove();res(b)};
    const grab=()=>{try{if(!v.videoWidth||!v.videoHeight)return false;const sc=Math.min(1,1280/Math.max(v.videoWidth,v.videoHeight)),c=document.createElement("canvas");c.width=Math.round(v.videoWidth*sc);c.height=Math.round(v.videoHeight*sc);c.getContext("2d").drawImage(v,0,0,c.width,c.height);c.toBlob(b=>fin(b&&b.size>2000?b:null),"image/jpeg",.85);return true}catch(e){return false}};
    const viaPlay=()=>{if(tried)return;tried=true;try{const p=v.play();(p&&p.then?p:Promise.resolve()).then(()=>{if(v.requestVideoFrameCallback)v.requestVideoFrameCallback(()=>{grab()||fin(null)});else setTimeout(()=>{grab()||fin(null)},500)}).catch(()=>fin(null))}catch(e){fin(null)}};
    v.addEventListener("loadedmetadata",()=>{try{v.currentTime=Math.min(0.1,(v.duration||1)/2)}catch(e){viaPlay()}});
    v.addEventListener("seeked",()=>{if(!grab())viaPlay()});
    v.addEventListener("loadeddata",()=>{setTimeout(()=>{if(!done&&!tried&&v.readyState>=2&&grab()===false)viaPlay()},2500)});
    v.addEventListener("error",()=>fin(null));
    setTimeout(()=>fin(null),25000);v.src=src;
  });
}
async function makePlaceholder(name){
  try{
    try{await document.fonts.load("700 80px 'Barlow Condensed'")}catch(e){}
    const W=1080,H=1350,c=document.createElement("canvas");c.width=W;c.height=H;const g=c.getContext("2d");
    g.fillStyle="#14213D";g.fillRect(0,0,W,H);g.fillStyle="#E4002B";g.fillRect(0,H-24,W,24);
    const img=await new Promise(r=>{const i=new Image();i.onload=()=>r(i);i.onerror=()=>r(null);i.src=LOGOS.white});
    if(img){const w=260,h=w*img.naturalHeight/img.naturalWidth;g.drawImage(img,(W-w)/2,150,w,h)}
    g.fillStyle="#E4002B";g.beginPath();g.arc(W/2,H/2+40,120,0,Math.PI*2);g.fill();
    g.fillStyle="#fff";g.beginPath();g.moveTo(W/2-34,H/2+40-60);g.lineTo(W/2-34,H/2+40+60);g.lineTo(W/2+66,H/2+40);g.closePath();g.fill();
    g.fillStyle="#fff";g.textAlign="center";g.font="700 84px 'Barlow Condensed',sans-serif";
    const t=String(name||"Video").toUpperCase().slice(0,28);g.fillText(t,W/2,H/2+300);
    g.fillStyle="#B4BECA";g.font="600 36px Barlow,sans-serif";g.fillText("VIDEO",W/2,H/2+360);
    return await new Promise(r=>c.toBlob(r,"image/jpeg",.9));
  }catch(e){return null}
}

  const groups={};due.concat(over.filter(x=>!dueSet.has(x.kind+x.id))).forEach(x=>{const k=x.owner||"Unassigned";(groups[k]=groups[k]||[]).push(x)});

  h+='<div class="panel"><h3>Due this week <span style="color:var(--muted);font-size:20px">'+due.length+'</span></h3>'+(due.length?'<div class="ow">'+Object.keys(groups).sort((a,b)=>a==="Unassigned"?1:b==="Unassigned"?-1:a.localeCompare(b)).map(o=>{const l=groups[o].filter(x=>dueSet.has(x.kind+x.id));return l.length?'<div class="panel"><h3 style="font-size:20px">'+esc(o)+' <span style="color:var(--muted)">'+l.length+'</span></h3><div class="list">'+l.map(rowFor).join("")+'</div></div>':""}).join("")+'</div>':'<p class="empty">Nothing due this week.</p>')+'</div>';
  return h;
}

   +ps.sort((a,b)=>(b.date||"").localeCompare(a.date||"")).map(p=>{const r=p.results||{};return '<tr><td><button style="border:0;background:none;padding:0;text-align:left;font-weight:600;text-decoration:underline" data-act="editpost" data-id="'+p.id+'">'+esc(p.title)+'</button></td><td>'+esc((CH[p.channel]||CH.other).name)+'</td><td>'+esc(fmtDate(p.date))+'</td>'+["reach","likes","comments","shares","attendance","signups"].map(k=>'<td class="n">'+(r[k]??"–")+'</td>').join("")+'</tr>'}).join("")+'</tbody></table></div></div>';

async function shrink(file){
  try{
    const bmp=await createImageBitmap(file);const m=2000,sc=Math.min(1,m/Math.max(bmp.width,bmp.height));
    if(sc===1&&file.size<2.5e6)return{blob:file,type:file.type};
    const c=document.createElement("canvas");c.width=Math.round(bmp.width*sc);c.height=Math.round(bmp.height*sc);c.getContext("2d").drawImage(bmp,0,0,c.width,c.height);
    const blob=await new Promise(r=>c.toBlob(r,"image/jpeg",.85));return{blob,type:"image/jpeg"};
  }catch(e){return{blob:file,type:file.type}}
}
async function uploadFiles(files){
  if(!S.assets)return;
  const arr=[...files].filter(f=>f.type.startsWith("image/"));let ok=0;
  for(const f of arr){
    toast("Uploading "+(ok+1)+" of "+arr.length+"…");
    try{
      const {blob,type}=await shrink(f);
      const r=await S.assets.upload(blob,{type:["image/png","image/jpeg","image/gif","image/webp"].includes(type)?type:"image/jpeg"});
      await saveDoc("photos",newId(),{assetId:r.id,caption:"",cat:S.pf==="all"?"general":S.pf,date:todayIso,created:Date.now()});ok++;
    }catch(e){toast("Could not upload "+f.name+(e&&e.code==="too_large"?" (too large)":""))}
  }
  if(ok)toast(ok+" photo"+(ok>1?"s":"")+" added");
}

  try{const r=await fetch("blob/"+x.assetId);const bl=await r.blob();const ext=(bl.type.split("/")[1]||"png").replace("jpeg","jpg");await S.dl.save({filename:((x.title||"graphic").replace(/[^\w\- ]+/g,"").trim()||"graphic")+"."+ext,data:bl})}catch(e){if(!e||e.code!=="declined")toast("Could not download that graphic.")}
