async function copyText(t,msg){try{await navigator.clipboard.writeText(t);toast(msg||("Copied "+t))}catch(e){toast("Copy this by hand: "+t.slice(0,60))}}

/* ---------- events ---------- */
document.addEventListener("click",async e=>{
  const el=e.target.closest("[data-act]");if(!el)return;
  const a=el.dataset.act,id=el.dataset.id;
  if(a==="closeScrim"){if(e.target===el)closeModal();return}
  if(a==="sel"){if(e.target.closest("button"))return;S.sel=el.dataset.date;render(true);return}
  if(a!=="pickown"&&a!=="setown"&&a!=="setownx")closePicker();
  if(a==="tab")setTab(id);
  else if(a==="who"){S.who=id||"";render(true)}
  else if(a==="claim"){if(S.me)await setOwner(el.dataset.k,id,S.me)}
  else if(a==="pickown"){openPicker(el)}
  else if(a==="setown"){closePicker();await setOwner(el.dataset.k,id,el.dataset.n||"")}
  else if(a==="setownx"){const v=($("#ownOther")||{}).value||"";closePicker();if(v.trim())await setOwner(el.dataset.k,id,v.trim())}
  else if(a==="dock")toggleDock();
  else if(a==="dockwho"){S.dockWho=id;drawDock()}
  else if(a==="top"){const t=TOP.find(x=>x.id===id);if(t){if(t.id==="projects")S.proj=null;setTab(S.last[t.id]||t.views[0][0])}}
  else if(a==="seek"){const v=$("#cv_"+id);if(v){v.currentTime=Number(el.dataset.t)||0;try{v.play()}catch(x){}}}
  else if(a==="pstep"){S.pstep=S.pstep||{};S.pstep[id]=Number(el.dataset.i);render(true);window.scrollTo(0,0)}
  else if(a==="pfsave"){const c=$("#pf_clips").value;await saveProj(id,{footage:$("#pf_foot").value.trim(),clips:c===""?null:Number(c)},"Footage saved")}
  else if(a==="pmsave"){const ct=$("#pm_type").value,T=CTYPE[ct];await saveProj(id,{ctype:ct,pillars:T?T.p.slice():[],brief:$("#pj_brief").value.trim(),platforms:[...document.querySelectorAll("#pj_plat input:checked")].map(i=>i.value)},"Saved")}
  else if(a==="pqsave"){const qa={};PQS.forEach(q=>{qa[q.k]=$("#pq_"+q.k).value.trim()});await saveProj(id,{qa},"Answers saved")}
  else if(a==="pkmake")pkMake(id);
  else if(a==="openproj"){S.tab="projects";S.proj=id;render(true);window.scrollTo(0,0)}
  else if(a==="projback"){S.proj=null;render(true)}
  else if(a==="savebrief"){const x=S.projects.find(q=>q.id===id);if(x){const o={...x,brief:$("#pj_brief").value.trim(),platforms:[...document.querySelectorAll("#pj_plat input:checked")].map(i=>i.value),updated:Date.now()};if(await saveDoc("projects",id,o)){render(true);toast("Brief saved")}}}
  else if(a==="copybrief"){const x=S.projects.find(q=>q.id===id);if(x)copyText(briefText(x),"Brief copied. Paste it into the editing tool.")}
  else if(a==="addcut")addCut(id);
  else if(a==="cutnote")cutNote(id);
  else if(a==="cutok")cutDecide(id,true);
  else if(a==="cutchg")askComment("Request changes to this cut","What needs to change?",t=>cutDecide(id,false,t));
  else if(a==="cutpost")cutToPost(id);
  else if(a==="delcut"){const c=S.cuts.find(q=>q.id===id);await delDoc("cuts",id);try{if(c&&S.assets){if(c.assetId)await S.assets.delete(c.assetId);if(c.stillId)await S.assets.delete(c.stillId)}}catch(x){}render(true);toast("Cut deleted")}
  else if(a==="prev"||a==="next"){const n=a==="next"?1:-1;if(S.view==="month")S.anchor=new Date(S.anchor.getFullYear(),S.anchor.getMonth()+n,1);else S.anchor=addDays(S.anchor,7*n);render(true)}
  else if(a==="today"){S.anchor=new Date();S.sel=todayIso;render(true)}
  else if(a==="view"){S.view=el.dataset.v;if(S.view==="week")S.anchor=pd(S.sel);render(true)}
  else if(a==="new"){e.stopPropagation();S.sel=el.dataset.date||S.sel;openItem(null,el.dataset.date)}
  else if(a==="newpost"){openPost(null,el.dataset.date||"")}
  else if(a==="edit"){e.stopPropagation();openItem(id)}
  else if(a==="editpost"){e.stopPropagation();openPost(id)}
  else if(a==="closeModal")closeModal();
  else if(a==="delitem"){await delDoc("items",id);closeModal();render(true);toast("Deleted")}
  else if(a==="delpost"){await delDoc("posts",id);closeModal();render(true);toast("Post deleted")}
  else if(a==="saveinfo"){const t=$("#infoBox").value;if(S.offline){S.info[id]=t;toast("Info saved")}else S.db.collection("info").doc(id).set({text:t}).then(()=>toast("Info saved")).catch(()=>toast("Could not save."))}
  else if(a==="pf"){S.pf=id;render(true)}
  else if(a==="vf"){S.vf=id;render(true)}
  else if(a==="addvlink")openVideoLink();
  else if(a==="video")openVideo(id);
  else if(a==="cpvlink"){const v=S.videos.find(x=>x.id===id);if(v)copyText(v.url,"Link copied")}
  else if(a==="delvideo"){const v=S.videos.find(x=>x.id===id);await delDoc("videos",id);try{if(v&&v.assetId&&S.assets)await S.assets.delete(v.assetId)}catch(x){}closeModal();render(true);toast("Video deleted")}
  else if(a==="pch"){S.pch=id;render(true)}
  else if(a==="photo")openPhoto(id);
  else if(a==="delphoto"){const p=S.photos.find(x=>x.id===id);await delDoc("photos",id);try{if(p&&S.assets)await S.assets.delete(p.assetId)}catch(x){}closeModal();render(true);toast("Photo deleted")}
  else if(a==="copy")copyText(el.dataset.v);
  else if(a==="dllogo")dlLogo(el.dataset.v);
  else if(a==="dlgfx")dlGfx(id);
  else if(a==="libtab"){S.libTab=el.dataset.v;render(true)}
  else if(a==="libcopy"){const x=S.lib.find(l=>l.id===id);if(x)copyText(x.text,"Copied "+x.title)}
  else if(a==="dellib"){const x=S.lib.find(l=>l.id===id);await delDoc("library",id);try{if(x&&x.assetId&&S.assets)await S.assets.delete(x.assetId)}catch(z){}toast("Removed")}
  else if(a==="libadd"){const t=formVal("lib_title").trim(),x=formVal("lib_text").trim();if(!t||!x){toast("Add a name and some text.");return}await saveDoc("library",newId(),{kind:S.libTab,title:t,text:x,created:Date.now()});toast("Saved to library")}
  else if(a==="twprev"){S.tw=addDays(S.tw,-7);render(true)} else if(a==="twnext"){S.tw=addDays(S.tw,7);render(true)} else if(a==="twnow"){S.tw=new Date();render(true)}
  else if(a==="itemdone"){const i=S.items.find(x=>x.id===id);if(i){await saveDoc("items",id,{...i,status:"done"});toast("Marked done")}}
  else if(a==="markposted"){await doStage(id,"posted","Marked posted")}
  else if(a==="approve"){const m=$("#modalRoot");await doApprove(id,el.dataset.lv);if(m.innerHTML)closeModal()}
  else if(a==="reqchg"){askComment("Request changes","Tell the team what to change",async t=>{await doChanges(id,t)})}
  else if(a==="savereview"){saveBuilder(true)}
  else if(a==="bpillar"||a==="baud"){const arr=a==="bpillar"?B.pillars:B.aud,i=arr.indexOf(id);if(i>=0)arr.splice(i,1);else arr.push(id);drawMsg();drawCheck()}
  else if(a==="bproof"){const x=MSG.proof.find(q=>q.id===$("#b_proof").value),c=$("#b_cap");if(!x){toast("Pick a proof point first.");return}c.value=(c.value.trim()?c.value.trim()+"\n\n":"")+x.text;updatePreview();drawCheck();toast("Proof point added")}
  else if(a==="cpproof"){const x=MSG.proof.find(q=>q.id===id);if(x)copyText(x.text,"Proof point copied")}
  else if(a==="cpbank"){const c=MSG.copyBank[Number(el.dataset.i)];if(c)copyText(c.caption+"\n\n"+c.tags,"Caption copied")}
  else if(a==="newproj")openProject();
  else if(a==="editproj")openProject(id);
  else if(a==="delproj"){await delDoc("projects",id);closeModal();render(true);toast("Project deleted")}
  else if(a==="projpost"){const x=S.projects.find(q=>q.id===id);if(x){const T=CTYPE[x.ctype];openPost(null,"",{title:x.name,owner:x.owner||"",ctype:x.ctype||"",pillars:(x.pillars||[]).slice(),aud:T?T.a.slice():[],project:x.id})}}
  else if(a==="kit")openKit(id);
  else if(a==="kitcopy"){try{await navigator.clipboard.write([new ClipboardItem({"image/png":pngBlobOf(id)})]);toast("Photo copied. Paste it into "+"your post.")}catch(x){toast("Copy was blocked. Press and hold the photo, then choose Copy or Save.")}}
  else if(a==="kitsave"){try{const b=await pngBlobOf(id);if(!S.dl){toast("Press and hold the photo, then choose Save.");return}await S.dl.save({filename:(el.dataset.n||"photo")+".png",data:b})}catch(x){toast("Save was cancelled. Press and hold the photo instead.")}}
  else if(a==="kitcap"||a==="kitcaponly"){const p=S.posts.find(x=>x.id===id);if(p)copyText(a==="kitcap"?(p.caption||"")+(p.hashtags?"\n\n"+p.hashtags:""):(p.caption||""),"Caption copied")}
  else if(a==="fmtgen")genSlides();
  else if(a==="fmtcap")fmtCaption();
  else if(a==="fmtphoto"){const el2=$("#b_fphotos");if(el2.innerHTML){el2.innerHTML="";return}const src=[...new Set([...S.photos.map(p=>p.assetId),...S.lib.filter(l=>l.kind==="graphics").map(l=>l.assetId)])];el2.innerHTML=src.length?'<div class="pick">'+src.map(s=>'<button type="button" data-act="fmtpick" data-id="'+esc(s)+'"><img alt="Photo" loading="lazy" src="blob/'+esc(s)+'"></button>').join("")+'</div>':'<p class="hint">No photos yet. Add some on the Photos tab.</p>'}
  else if(a==="fmtpick"){gatherFmt();B.fmt.photo=id;drawFormat()}
  else if(a==="fmtnophoto"){gatherFmt();delete B.fmt.photo;drawFormat()}
  else if(a==="resubmit"||a==="tore"){await doStage(id,"review","Sent to review");if($("#modalRoot").innerHTML)closeModal()}
  else if(a==="submitweek")await submitWeek(el.dataset.w);
  else if(a==="approveweek")await approveWeek(el.dataset.w,el.dataset.lv);
  else if(a==="reqweek"){const w=el.dataset.w;askComment("Request changes to the week","What needs to change for "+weekLabel(w)+"?",async t=>{await reqWeek(w,t)})}
  else if(a==="templates")openTemplates();
  else if(a==="tplpick"){T.id=id;openTemplates()}
  else if(a==="pv"){B.pv=el.dataset.v;B.pi=0;syncPv();updatePreview()}
  else if(a==="pvnext"){B.pi=(B.pi+1)%mediaIds().length;updatePreview()} else if(a==="pvprev"){B.pi=(B.pi-1+mediaIds().length)%mediaIds().length;updatePreview()}
  else if(a==="pickvid"){const el2=$("#b_vpick");if(el2.innerHTML){el2.innerHTML="";return}el2.innerHTML=S.videos.length?'<div class="vlist">'+S.videos.map(v=>'<button type="button" class="btn sm" data-act="usevid" data-id="'+v.id+'">'+esc(v.title||"Untitled video")+'</button>').join("")+'</div>':'<p class="hint">No videos in the Videos tab yet.</p>'}
  else if(a==="usevid")useLibVideo(id);
  else if(a==="rmvid"){B.video=null;B.pi=0;drawVideo();updatePreview()}
  else if(a==="cpcap")copyText(formVal("b_cap"),"Caption copied");
  else if(a==="cptag")copyText(formVal("b_tags"),"Hashtags copied");
  else if(a==="cpboth")copyText(formVal("b_cap")+"\n\n"+formVal("b_tags"),"Caption and hashtags copied");
  else if(a==="rmgfx"){B.photoIds.splice(Number(el.dataset.i),1);B.pi=0;drawThumbs();updatePreview()}
  else if(a==="pickgfx"){const el2=$("#b_pick");if(el2.innerHTML){el2.innerHTML="";return}const src=[...S.lib.filter(l=>l.kind==="graphics").map(l=>l.assetId),...S.photos.map(p=>p.assetId)];el2.innerHTML=src.length?'<div class="pick">'+src.map(s=>'<button type="button" data-act="addgfx" data-id="'+esc(s)+'"><img alt="Library graphic" src="blob/'+esc(s)+'"></button>').join("")+'</div>':'<p class="hint">No graphics in the library or Photos yet.</p>'}
  else if(a==="addgfx"){if(!B.photoIds.includes(id))B.photoIds.push(id);drawThumbs();updatePreview()}
  else if(a==="inscap"){const x=S.lib.find(l=>l.id===formVal("b_libcap"));if(x){$("#b_cap").value=x.text;updatePreview()}}
  else if(a==="instag"){const x=S.lib.find(l=>l.id===formVal("b_libtag"));if(x){$("#b_tags").value=x.text;updatePreview()}}
  else if(a==="savetpl"){const d=draft();if(!d.caption){toast("Write a caption first.");return}const nm=d.title||"Saved template";await saveDoc("templates",newId(),{name:nm,channel:d.channel,type:d.type,caption:d.caption,hashtags:d.hashtags,time:d.time,created:Date.now()});toast("Saved as a template")}
});
document.addEventListener("keydown",e=>{
  if(e.key==="Escape")closeModal();
  if((e.key==="Enter"||e.key===" ")&&e.target.classList&&e.target.classList.contains("cell")){e.preventDefault();S.sel=e.target.dataset.date;render(true)}
});
document.addEventListener("input",e=>{
  const t=e.target;
  if(t.closest&&t.closest("#postForm")&&B){updatePreview();if(t.id==="b_ch"){B.pv=t.value==="linkedin"?"linkedin":"instagram";syncPv();updatePreview()}}
  else if(t.closest&&t.closest("#tplForm"))updateTplPrev();
  else if(t.id==="libq"){S.libq=t.value;$("#libList").innerHTML=libList()}
});
document.addEventListener("change",e=>{
  const t=e.target;
  if(t.id==="fileIn"){uploadFiles(t.files);t.value=""}
  else if(t.id==="vidIn"){uploadVideos(t.files);t.value=""}
  else if(t.id==="b_up"){uploadGfx(t.files);t.value=""}
  else if(t.id==="b_fmt"){const v=t.value;gatherFmt();if(!v)B.fmt=null;else{const o=B.fmt||{};B.fmt={id:v,f:o.f||{},photo:o.photo};const ty=$("#b_type");if(ty&&FORMATS[v].type)ty.value=FORMATS[v].type}drawFormat();drawCheck();updatePreview()}
  else if(t.id==="b_client"){gatherFmt();B.flags.client=t.checked;drawFormat()}
  else if(t.dataset&&t.dataset.ck&&B){B.check[t.dataset.ck]=t.checked;drawCheck()}
  else if(t.id==="b_ctype"){B.ctype=t.value;const T=CTYPE[B.ctype];if(T){if(!B.pillars.length)B.pillars=T.p.slice();if(!B.aud.length)B.aud=T.a.slice()}drawMsg();drawCheck()}
  else if(t.id==="b_proj"){B.project=t.value}
  else if(t.id==="b_vup"){const f=t.files[0];t.value="";attachVideo(f)}
  else if(t.id==="b_vstill"){const f=t.files[0];t.value="";attachStill(f)}
  else if(t.id==="libUp"){(async()=>{for(const f of [...t.files]){try{const {blob,type}=await shrink(f);const r=await S.assets.upload(blob,{type:["image/png","image/jpeg","image/gif","image/webp"].includes(type)?type:"image/jpeg"});await saveDoc("library",newId(),{kind:"graphics",title:f.name.replace(/\.[^.]+$/,""),assetId:r.id,created:Date.now()})}catch(x){toast("Could not upload "+f.name)}}t.value="";toast("Graphics added")})()}
  else if(t.id==="roleSel"){
    const v=t.value;
    if(v.indexOf("p:")===0){const m=personByName(v.slice(2));if(m){S.me=m.n;S.role=m.r;try{localStorage.setItem("gscg-me",m.n);localStorage.setItem("gscg-role",m.r)}catch(x){}}}
    else{S.me="";S.role=ROLES[v]?v:"member";try{localStorage.removeItem("gscg-me");localStorage.setItem("gscg-role",S.role)}catch(x){}}
    renderRoleSel();render(true);
  }
});
document.addEventListener("dragover",e=>{const d=$("#drop");if(d){e.preventDefault();d.classList.add("over")}});
let ckT=null;
document.addEventListener("click",e=>{const p=$("#ownPop");if(p&&!p.hidden&&!e.target.closest("#ownPop")&&!e.target.closest('[data-act="pickown"]'))closePicker()},true);
document.addEventListener("keydown",e=>{if(e.key==="Escape"){closePicker();toggleDock(false)}});
document.addEventListener("input",e=>{const t=e.target;if(!B)return;if(t.id&&t.id.indexOf("ff_")===0&&B.fmt){B.fmt.f[t.id.slice(3)]=t.value;return}if(t.closest&&t.closest("#postForm")&&!(t.dataset&&t.dataset.ck)){clearTimeout(ckT);ckT=setTimeout(drawCheck,300)}});
document.addEventListener("dragleave",()=>{const d=$("#drop");if(d)d.classList.remove("over")});
document.addEventListener("drop",e=>{const d=$("#drop");if(d){e.preventDefault();d.classList.remove("over");if(S.tab==="videos")uploadVideos(e.dataTransfer.files);else uploadFiles(e.dataTransfer.files)}});

function setTab(id){if(!TABS.some(t=>t.id===id))id="thisweek";S.tab=id;S.last[topOf(id).id]=id;if(id!=="projects")S.proj=null;try{history.replaceState(null,"","#"+id)}catch(e){location.hash=id}render(true);window.scrollTo(0,0)}
function fromHash(){const h=location.hash.slice(1);if(TABS.some(t=>t.id===h)){S.tab=h}}
window.addEventListener("hashchange",()=>{fromHash();render(true)});
$("#themeBtn").addEventListener("click",()=>{const r=document.documentElement;const dark=r.dataset.theme?r.dataset.theme==="dark":matchMedia("(prefers-color-scheme: dark)").matches;r.dataset.theme=dark?"light":"dark";try{localStorage.setItem("gscg-theme",r.dataset.theme)}catch(e){}});
try{const t=localStorage.getItem("gscg-theme");if(t)document.documentElement.dataset.theme=t}catch(e){}
function renderRoleSel(){
  const opt=p=>'<option value="p:'+esc(p.n)+'"'+(S.me===p.n?" selected":"")+'>'+esc(p.n)+'</option>';
  $("#roleSel").innerHTML='<option value="member"'+(!S.me&&S.role==="member"?" selected":"")+'>Someone else</option>'
   +'<optgroup label="Directors">'+PEOPLE.filter(p=>p.r==="director").map(opt).join("")+'</optgroup>'
   +'<optgroup label="Marketing team">'+PEOPLE.filter(p=>p.r==="member").map(opt).join("")+'</optgroup>'
   +'<optgroup label="Faculty advisor">'+PEOPLE.filter(p=>p.r==="advisor").map(opt).join("")+'</optgroup>';
}
renderRoleSel();

fromHash();render(true);initStore();
</script>
